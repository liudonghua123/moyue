<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="wp2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a4d"/>
      <stop offset="0.55" stop-color="#54495c"/>
      <stop offset="1" stop-color="#6d5a64"/>
    </linearGradient>
    <linearGradient id="wp2-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3440"/><stop offset="1" stop-color="#2b2731"/>
    </linearGradient>
    <filter id="wp2-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- ======== 背景层：已是黄昏独自愁，更著风和雨 ======== -->
  <g class="bg">
    <rect width="1600" height="900" fill="url(#wp2-sky)"/>

    <!-- 暮云沉沉 -->
    <g filter="url(#wp2-soft)">
      <ellipse class="bg-cloud bg-cloud-a" cx="420" cy="180" rx="300" ry="30" fill="#332e40" opacity="0.7"/>
      <ellipse class="bg-cloud bg-cloud-b" cx="1150" cy="240" rx="320" ry="34" fill="#2e2938" opacity="0.65"/>
    </g>

    <!-- 风雨斜织 -->
    <g stroke="#9aa0b2" stroke-width="1.7" opacity="0.45">
      <line class="bg-rain" x1="180" y1="100" x2="140" y2="180"/>
      <line class="bg-rain" x1="480" y1="70" x2="440" y2="150"/>
      <line class="bg-rain" x1="760" y1="120" x2="720" y2="200"/>
      <line class="bg-rain" x1="1060" y1="80" x2="1020" y2="160"/>
      <line class="bg-rain" x1="1360" y1="130" x2="1320" y2="210"/>
      <line class="bg-rain" x1="240" y1="330" x2="200" y2="410"/>
      <line class="bg-rain" x1="880" y1="330" x2="840" y2="410"/>
      <line class="bg-rain" x1="1440" y1="320" x2="1400" y2="400"/>
    </g>

    <!-- 驿站远影 -->
    <g class="bg-posthouse">
      <path d="M1330,430 L1520,430 L1520,510 L1330,510 Z" fill="#332d3c"/>
      <path d="M1316,430 L1534,430 L1510,398 Q1425,380 1340,398 Z" fill="#2a2532"/>
      <rect x="1400" y="450" width="50" height="60" fill="#241f2a"/>
    </g>

    <!-- 远山雾霭 -->
    <path d="M0,430 L300,360 L600,440 L900,370 L1200,450 L1600,380 L1600,620 L0,620 Z" fill="#443c4e" filter="url(#wp2-soft)" opacity="0.75"/>

    <!-- 地面 -->
    <rect y="620" width="1600" height="280" fill="url(#wp2-ground)"/>
    <g stroke="#4a4354" stroke-width="2" fill="none" opacity="0.5">
      <path class="bg-flow" d="M200,740 Q340,730 480,740 T760,740"/>
      <path class="bg-flow" d="M900,800 Q1060,790 1220,800"/>
    </g>
  </g>

  <!-- ======== 人物层：驿外断桥边，寂寞开无主 ======== -->
  <g class="fg">
    <!-- 断桥：半截残存 -->
    <g class="fg-bridge">
      <path d="M180,700 L560,700 L560,724 L180,724 Z" fill="#332c3c"/>
      <!-- 断口：右侧齐折 -->
      <path d="M560,700 L588,706 L586,718 L560,724 Z" fill="#241f2a"/>
      <!-- 桥栏残段 -->
      <rect x="180" y="668" width="200" height="9" fill="#2a2433"/>
      <g stroke="#2a2433" stroke-width="6">
        <line x1="210" y1="668" x2="210" y2="700"/>
        <line x1="270" y1="668" x2="270" y2="700"/>
        <line x1="330" y1="668" x2="330" y2="700"/>
      </g>
      <!-- 桥墩 -->
      <path d="M230,724 L250,820 L274,820 L258,724 Z" fill="#282231"/>
      <path d="M460,724 L480,820 L504,820 L486,724 Z" fill="#282231"/>
    </g>

    <!-- 一树老梅：桥畔独放 -->
    <g class="fg-plum">
      <!-- 虬枝 -->
      <path class="fg-trunk" d="M760,720 Q770,600 740,520 Q716,460 748,400 Q770,358 736,320" fill="none" stroke="#241d29" stroke-width="16" stroke-linecap="round"/>
      <path class="fg-trunk" d="M742,480 Q680,450 640,470 Q600,490 566,470" fill="none" stroke="#241d29" stroke-width="10" stroke-linecap="round"/>
      <path class="fg-trunk" d="M748,398 Q810,370 850,390 Q890,410 930,392" fill="none" stroke="#241d29" stroke-width="10" stroke-linecap="round"/>
      <path class="fg-trunk" d="M736,322 Q700,290 656,296" fill="none" stroke="#241d29" stroke-width="8" stroke-linecap="round"/>
      <path class="fg-trunk" d="M748,398 Q760,340 800,310" fill="none" stroke="#241d29" stroke-width="8" stroke-linecap="round"/>

      <!-- 梅花：疏影点点 -->
      <g fill="#c86a78">
        <circle class="fg-blossom" cx="656" cy="294" r="11"/>
        <circle class="fg-blossom" cx="700" cy="308" r="9"/>
        <circle class="fg-blossom" cx="800" cy="306" r="11"/>
        <circle class="fg-blossom" cx="846" cy="392" r="10"/>
        <circle class="fg-blossom" cx="932" cy="390" r="9"/>
        <circle class="fg-blossom" cx="566" cy="468" r="10"/>
        <circle class="fg-blossom" cx="640" cy="474" r="8"/>
        <circle class="fg-blossom" cx="744" cy="416" r="9"/>
        <circle class="fg-blossom" cx="616" cy="452" r="7"/>
        <circle class="fg-blossom" cx="878" cy="404" r="7"/>
      </g>
      <g fill="#e08a94">
        <circle class="fg-blossom" cx="672" cy="310" r="5"/>
        <circle class="fg-blossom" cx="812" cy="320" r="5"/>
        <circle class="fg-blossom" cx="586" cy="458" r="4.5"/>
        <circle class="fg-blossom" cx="908" cy="398" r="4.5"/>
        <circle class="fg-blossom" cx="760" cy="430" r="4"/>
      </g>

      <!-- 落瓣：零落成泥 -->
      <path class="fg-petal" d="M0,0 q4.5,3 9,0 q-4.5,4.5 -9,0" fill="#c86a78"/>
      <path class="fg-petal fg-petal-b" d="M0,0 q4.5,3 9,0 q-4.5,4.5 -9,0" fill="#b85a6c"/>
    </g>
  </g>

  <style>
    /* ---- 背景动画：风和雨 ---- */
    .bg-cloud { animation: wp2-drift ease-in-out infinite; }
    .bg-cloud-a { animation-duration: 58s; }
    .bg-cloud-b { animation-duration: 74s; animation-delay: -30s; }
    @keyframes wp2-drift { 0%,100% { transform: translateX(-40px); } 50% { transform: translateX(40px); } }

    .bg-rain { animation: wp2-rain 1.2s linear infinite; }
    .bg-rain:nth-child(2n) { animation-duration: 1.5s; animation-delay: -0.6s; }
    .bg-rain:nth-child(3n) { animation-duration: 1s; animation-delay: -0.9s; }
    @keyframes wp2-rain {
      from { transform: translate(0, -60px); opacity: 0; }
      20% { opacity: 0.5; }
      85% { opacity: 0.5; }
      to { transform: translate(-110px, 340px); opacity: 0; }
    }

    .bg-flow { stroke-dasharray: 200; stroke-dashoffset: 200; animation: wp2-flow 8s linear infinite; }
    .bg-flow:nth-child(2) { animation-duration: 10s; animation-delay: -4s; }
    @keyframes wp2-flow { to { stroke-dashoffset: -200; } }

    /* ---- 人物层动画：孤梅傲风雨 ---- */
    /* 全树当风摇而不折 */
    .fg-plum { animation: wp2-tree 7s ease-in-out infinite; transform-origin: 760px 720px; }
    @keyframes wp2-tree { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.4deg); } }

    /* 虬枝在整体摆动之外自有颤劲 */
    .fg-trunk { animation: wp2-branch 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .fg-trunk:nth-child(2n) { animation-delay: 1.2s; animation-duration: 6s; }
    .fg-trunk:nth-child(3n) { animation-delay: 2.4s; }
    @keyframes wp2-branch { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1deg); } }

    .fg-blossom { animation: wp2-shiver 4.5s ease-in-out infinite; }
    .fg-blossom:nth-child(2n) { animation-delay: 1.1s; animation-duration: 5.5s; }
    .fg-blossom:nth-child(3n) { animation-delay: 2.2s; }
    @keyframes wp2-shiver { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-2px, 2px); } }

    /* 落瓣随风入泥 */
    .fg-petal { animation: wp2-petal 9s linear infinite; transform-box: fill-box; transform-origin: center; }
    .fg-petal-b { animation-duration: 12s; animation-delay: -5s; }
    @keyframes wp2-petal {
      0% { transform: translate(770px, 430px) rotate(0deg); opacity: 0; }
      12% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(860px, 780px) rotate(340deg); opacity: 0; }
    }
  </style>
</svg>
