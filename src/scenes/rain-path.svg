<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="rm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7584"/>
      <stop offset="0.6" stop-color="#8d97a1"/>
      <stop offset="1" stop-color="#a5adb2"/>
    </linearGradient>
    <linearGradient id="rm-m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79828c"/><stop offset="1" stop-color="#66707a"/>
    </linearGradient>
    <linearGradient id="rm-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#575f58"/><stop offset="1" stop-color="#454d48"/>
    </linearGradient>
    <filter id="rm-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ======== 背景层：清明时节雨纷纷 ======== -->
  <g class="bg">
    <rect width="1600" height="900" fill="url(#rm-sky)"/>

    <!-- 远山烟雨 -->
    <path d="M0,400 L260,320 L520,400 L780,330 L1040,410 L1300,340 L1600,410 L1600,640 L0,640 Z" fill="url(#rm-m1)" filter="url(#rm-soft)" opacity="0.85"/>

    <!-- 杏花村：雨雾深处 -->
    <g class="bg-village">
      <path d="M1090,520 L1170,520 L1170,572 L1090,572 Z" fill="#4a4f56"/>
      <path d="M1078,520 L1182,520 L1130,490 Z" fill="#3c4048"/>
      <path d="M1210,536 L1274,536 L1274,578 L1210,578 Z" fill="#4a4f56"/>
      <path d="M1200,536 L1284,536 L1242,510 Z" fill="#3c4048"/>
      <!-- 酒旗 -->
      <line x1="1130" y1="490" x2="1130" y2="466" stroke="#33373d" stroke-width="4"/>
      <path class="bg-flag" d="M1130,466 L1160,470 L1156,488 L1130,484 Z" fill="#7a6a55"/>
    </g>

    <!-- 杏花林：粉白一色 -->
    <g class="bg-apricot" fill="#d9c4cd">
      <circle class="bg-blossom" cx="1320" cy="520" r="34"/>
      <circle class="bg-blossom" cx="1370" cy="490" r="30"/>
      <circle class="bg-blossom" cx="1410" cy="530" r="28"/>
      <circle class="bg-blossom" cx="1460" cy="500" r="32"/>
      <circle class="bg-blossom" cx="1500" cy="540" r="26"/>
      <circle class="bg-blossom" cx="1350" cy="556" r="26"/>
    </g>
    <g stroke="#4d5258" stroke-width="5" fill="none" opacity="0.8">
      <path d="M1330,560 L1338,470 M1370,548 L1372,452 M1430,556 L1428,462 M1480,560 L1484,472"/>
    </g>

    <!-- 雨幕：斜织的细雨 -->
    <g stroke="#c3ccd2" stroke-width="1.6" opacity="0.5">
      <line class="bg-rain" x1="120" y1="80" x2="90" y2="160"/>
      <line class="bg-rain" x1="360" y1="60" x2="330" y2="140"/>
      <line class="bg-rain" x1="600" y1="100" x2="570" y2="180"/>
      <line class="bg-rain" x1="840" y1="70" x2="810" y2="150"/>
      <line class="bg-rain" x1="1080" y1="110" x2="1050" y2="190"/>
      <line class="bg-rain" x1="1320" y1="80" x2="1290" y2="160"/>
      <line class="bg-rain" x1="1500" y1="140" x2="1470" y2="220"/>
      <line class="bg-rain" x1="240" y1="300" x2="210" y2="380"/>
      <line class="bg-rain" x1="720" y1="320" x2="690" y2="400"/>
      <line class="bg-rain" x1="1180" y1="300" x2="1150" y2="380"/>
    </g>

    <!-- 田路 -->
    <rect y="620" width="1600" height="280" fill="url(#rm-ground)"/>
    <path d="M0,760 Q500,700 900,730 T1600,700 L1600,900 L0,900 Z" fill="#4d564e"/>
    <path class="bg-path" d="M240,900 Q560,800 860,760 Q1120,730 1400,720" fill="none" stroke="#6a7268" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
    <!-- 水洼涟漪 -->
    <ellipse class="bg-puddle" cx="500" cy="820" rx="46" ry="9" fill="none" stroke="#8b958f" stroke-width="2"/>
  </g>

  <!-- ======== 人物层：牧童遥指杏花村 ======== -->
  <g class="fg">
    <!-- 行人：撑伞欲断魂 -->
    <g class="fg-walker">
      <path class="fg-umbrella" d="M420,548 Q470,506 520,548 Q470,530 420,548 Z" fill="#3d4450"/>
      <path d="M466,540 L470,560" stroke="#2c323c" stroke-width="4"/>
      <path class="fg-wrobe" d="M456,640 Q458,600 472,594 L484,594 Q500,600 502,640 L504,682 L454,682 Z" fill="#2b323c"/>
      <circle class="fg-whead" cx="479" cy="580" r="12" fill="#1d232c"/>
      <path d="M458,612 L450,636 M500,612 L510,634" stroke="#2b323c" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g class="fg-walker fg-walker-b">
      <path class="fg-umbrella" d="M600,600 Q640,566 680,600 Q640,586 600,600 Z" fill="#4a5060"/>
      <path d="M637,594 L640,610" stroke="#333947" stroke-width="3.4"/>
      <path class="fg-wrobe" d="M622,676 Q624,644 636,640 L646,640 Q660,644 662,676 L663,710 L621,710 Z" fill="#37404c"/>
      <circle class="fg-whead" cx="642" cy="626" r="10" fill="#232a34"/>
    </g>

    <!-- 牧童骑牛：遥指杏花村 -->
    <g class="fg-oxboy">
      <!-- 牛 -->
      <g class="fg-ox">
        <path d="M880,712 Q886,664 940,660 L1020,660 Q1070,664 1076,712 L1072,730 Q1000,744 888,730 Z" fill="#3a3230"/>
        <path d="M880,716 Q980,732 1074,716 L1072,730 Q1000,744 888,730 Z" fill="#2c2624"/>
        <!-- 牛头 -->
        <path d="M1070,678 Q1104,668 1108,690 Q1106,706 1076,704 Z" fill="#3a3230"/>
        <circle cx="1096" cy="686" r="3" fill="#181412"/>
        <!-- 牛角 -->
        <path d="M1096,672 Q1108,656 1120,660 M1078,670 Q1070,654 1058,658" stroke="#241f1d" stroke-width="5" fill="none"/>
        <!-- 牛尾 -->
        <path class="fg-tail" d="M884,678 Q868,700 872,724" stroke="#2c2624" stroke-width="5" fill="none"/>
      </g>
      <!-- 牧童 -->
      <path class="fg-brobe" d="M952,620 Q954,590 966,586 L978,586 Q992,590 994,620 L996,656 L950,656 Z" fill="#4a5568"/>
      <circle class="fg-bhead" cx="973" cy="572" r="12" fill="#2a3140"/>
      <!-- 髻与红绳 -->
      <circle cx="973" cy="560" r="6" fill="#2a3140"/>
      <path d="M973,556 L981,552" stroke="#8c5a5a" stroke-width="2.4"/>
      <!-- 遥指的手臂：指向杏花村 -->
      <path class="fg-point" d="M990,600 L1032,586 L1074,578" stroke="#4a5568" stroke-width="9" stroke-linecap="round" fill="none"/>
      <!-- 短笛 -->
      <path class="fg-flute" d="M958,606 L990,596" stroke="#6a5240" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <style>
    /* ---- 背景动画：雨纷纷 ---- */
    .bg-rain { animation: rm-rain 1.1s linear infinite; }
    .bg-rain:nth-child(2n) { animation-duration: 1.4s; animation-delay: -0.5s; }
    .bg-rain:nth-child(3n) { animation-duration: 0.9s; animation-delay: -0.8s; }
    @keyframes rm-rain {
      from { transform: translate(0, -60px); opacity: 0; }
      20% { opacity: 0.6; }
      85% { opacity: 0.6; }
      to { transform: translate(-90px, 340px); opacity: 0; }
    }

    .bg-flag { animation: rm-flag 3.2s ease-in-out infinite; transform-origin: 1130px 476px; }
    @keyframes rm-flag { 0%,100% { transform: skewY(-4deg); } 50% { transform: skewY(4deg); } }

    .bg-blossom { animation: rm-blossom 6s ease-in-out infinite; }
    .bg-blossom:nth-child(2n) { animation-delay: 1.8s; animation-duration: 7.5s; }
    .bg-blossom:nth-child(3n) { animation-delay: 3.4s; }
    @keyframes rm-blossom { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

    .bg-puddle { animation: rm-puddle 2.4s ease-out infinite; transform-origin: 500px 820px; }
    @keyframes rm-puddle { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.5); opacity: 0; } }

    /* ---- 人物动画 ---- */
    .fg-walker { animation: rm-walk 7s ease-in-out infinite; transform-origin: 479px 682px; }
    @keyframes rm-walk { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(0.6deg); } }
    .fg-walker-b { animation-duration: 8.5s; animation-delay: -3s; transform-origin: 642px 710px; }
    .fg-umbrella { animation: rm-umbrella 5s ease-in-out infinite; transform-origin: 470px 548px; }
    @keyframes rm-umbrella { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .fg-whead { animation: rm-whead 9s ease-in-out infinite; transform-origin: 479px 592px; }
    @keyframes rm-whead { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(7deg); } }

    .fg-oxboy { animation: rm-oxbob 6s ease-in-out infinite; transform-origin: 980px 730px; }
    @keyframes rm-oxbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .fg-ox { animation: rm-oxsway 9s ease-in-out infinite; transform-origin: 980px 712px; }
    @keyframes rm-oxsway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(0.7deg); } }
    .fg-tail { animation: rm-tail 4s ease-in-out infinite; transform-origin: 884px 678px; }
    @keyframes rm-tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
    .fg-bhead { animation: rm-bhead 10s ease-in-out infinite; transform-origin: 973px 584px; }
    @keyframes rm-bhead { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(6deg); } }
    /* 遥指：抬起后停顿 */
    .fg-point { animation: rm-point 10s ease-in-out infinite; transform-origin: 990px 600px; }
    @keyframes rm-point {
      0%, 30% { transform: rotate(6deg); }
      55%, 85% { transform: rotate(-8deg); }
      100% { transform: rotate(6deg); }
    }
  </style>
</svg>
