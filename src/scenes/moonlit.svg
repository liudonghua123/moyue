<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="mn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#101728"/>
      <stop offset="1" stop-color="#1a2234"/>
    </linearGradient>
    <radialGradient id="mn-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6efdb" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#e9debc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e9debc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mn-beam" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#f2eac9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f2eac9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mn-m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222a40"/><stop offset="1" stop-color="#181f30"/>
    </linearGradient>
    <linearGradient id="mn-m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a29"/><stop offset="1" stop-color="#0f1420"/>
    </linearGradient>
    <filter id="mn-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ======== 背景层 ======== -->
  <g class="bg">
    <rect width="1600" height="900" fill="url(#mn-sky)"/>

    <!-- 星：各自闪烁 -->
    <g class="bg-stars" fill="#e9e3d0">
      <circle class="bg-star" cx="150" cy="110" r="1.8"/>
      <circle class="bg-star" cx="360" cy="70" r="1.2"/>
      <circle class="bg-star" cx="540" cy="160" r="1.6"/>
      <circle class="bg-star" cx="820" cy="60" r="1.3"/>
      <circle class="bg-star" cx="1010" cy="150" r="1.7"/>
      <circle class="bg-star" cx="1400" cy="80" r="1.5"/>
      <circle class="bg-star" cx="1520" cy="220" r="1.2"/>
      <circle class="bg-star" cx="280" cy="250" r="1.1"/>
      <circle class="bg-star" cx="680" cy="290" r="1.4"/>
      <circle class="bg-star" cx="1300" cy="320" r="1.2"/>
      <circle class="bg-star" cx="90" cy="330" r="1.3"/>
    </g>

    <!-- 月：缓慢西行 -->
    <g class="bg-moontrack">
      <circle cx="1150" cy="210" r="150" fill="url(#mn-halo)"/>
      <circle cx="1150" cy="210" r="60" fill="#f4edd8"/>
      <circle cx="1130" cy="192" r="10" fill="#e2d6ae" opacity="0.55"/>
      <circle cx="1170" cy="226" r="7" fill="#e2d6ae" opacity="0.45"/>
      <circle cx="1142" cy="232" r="5" fill="#e2d6ae" opacity="0.4"/>
    </g>

    <!-- 流云：两层视差 -->
    <g class="bg-cloud bg-cloud-a" filter="url(#mn-soft)">
      <ellipse cx="380" cy="170" rx="210" ry="26" fill="#242c44" opacity="0.5"/>
      <ellipse cx="510" cy="192" rx="150" ry="20" fill="#202840" opacity="0.45"/>
    </g>
    <g class="bg-cloud bg-cloud-b" filter="url(#mn-soft)">
      <ellipse cx="960" cy="340" rx="250" ry="22" fill="#232b42" opacity="0.42"/>
      <ellipse cx="1120" cy="360" rx="160" ry="18" fill="#1e263a" opacity="0.38"/>
    </g>

    <!-- 远山两重 -->
    <path d="M0,560 Q200,470 420,545 T860,540 T1300,555 T1600,520 L1600,900 L0,900 Z" fill="url(#mn-m1)"/>
    <path d="M0,650 Q260,575 520,635 T1040,640 T1600,610 L1600,900 L0,900 Z" fill="url(#mn-m2)"/>

    <!-- 月光光束：明暗呼吸 -->
    <path class="bg-beam" d="M1150,250 L500,900 L960,900 L1150,250 Z" fill="url(#mn-beam)"/>
  </g>

  <!-- ======== 人物层：屋与望月人 ======== -->
  <g class="fg">
    <rect x="0" y="700" width="1600" height="200" fill="#0a0e17"/>
    <rect x="960" y="545" width="500" height="355" fill="#0d1220"/>
    <rect x="990" y="575" width="440" height="300" fill="#131a2b"/>
    <g stroke="#090d17" stroke-width="10">
      <line x1="1210" y1="575" x2="1210" y2="875"/>
      <line x1="990" y1="725" x2="1430" y2="725"/>
    </g>
    <rect x="982" y="567" width="456" height="308" fill="none" stroke="#090d17" stroke-width="14"/>

    <!-- 望月人：抬头 → 低头，呼吸与衣摆 -->
    <g class="fg-scholar">
      <!-- 长袍 -->
      <path d="M1082,875 L1082,762 Q1082,742 1100,735 L1107,716 Q1112,703 1128,703 Q1144,703 1149,716 L1156,735 Q1173,742 1173,762 L1173,875 Z" fill="#060910"/>
      <!-- 头（独立转头） -->
      <circle class="fg-head" cx="1127" cy="696" r="18" fill="#060910"/>
      <circle class="fg-head" cx="1127" cy="676" r="7" fill="#060910"/>
      <!-- 举头的手臂 -->
      <path class="fg-arm" d="M1150,740 L1180,704" stroke="#060910" stroke-width="10" stroke-linecap="round"/>
      <!-- 广袖摆 -->
      <path class="fg-sleeve" d="M1096,760 Q1072,790 1062,830 Q1060,846 1074,846 Q1084,844 1090,826 Q1098,792 1108,768 Z" fill="#060910"/>
    </g>
  </g>

  <style>
    /* ---- 背景动画 ---- */
    .bg-star { animation: mn-twinkle 4.5s ease-in-out infinite; }
    .bg-star:nth-child(2n) { animation-delay: 1.3s; animation-duration: 5.5s; }
    .bg-star:nth-child(3n) { animation-delay: 2.4s; animation-duration: 6.5s; }
    .bg-star:nth-child(5n) { animation-delay: 3.2s; }
    @keyframes mn-twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }

    /* 月在天上缓慢西移，一夜一行 */
    .bg-moontrack { animation: mn-moonpath 90s linear infinite alternate; }
    @keyframes mn-moonpath { from { transform: translateX(40px); } to { transform: translateX(-90px); } }

    .bg-cloud-a { animation: mn-drift-a 70s linear infinite; }
    .bg-cloud-b { animation: mn-drift-b 95s linear infinite; }
    @keyframes mn-drift-a { from { transform: translateX(-320px); } to { transform: translateX(1500px); } }
    @keyframes mn-drift-b { from { transform: translateX(350px); } to { transform: translateX(-1650px); } }

    .bg-beam { animation: mn-beam 9s ease-in-out infinite; }
    @keyframes mn-beam { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    /* ---- 人物动画（与背景节奏无关） ---- */
    .fg-scholar { animation: mn-breathe 6s ease-in-out infinite; transform-origin: 1127px 875px; }
    @keyframes mn-breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.985); } }

    /* 举头望明月，低头思故乡 */
    .fg-head { animation: mn-gaze 14s ease-in-out infinite; transform-origin: 1127px 714px; }
    @keyframes mn-gaze {
      0%, 18% { transform: rotate(0deg); }
      32%, 58% { transform: rotate(-14deg); }
      72%, 100% { transform: rotate(6deg); }
    }
    .fg-arm { animation: mn-arm 14s ease-in-out infinite; transform-origin: 1150px 740px; }
    @keyframes mn-arm {
      0%, 18% { transform: rotate(0deg); }
      32%, 58% { transform: rotate(-10deg); }
      72%, 100% { transform: rotate(4deg); }
    }
    .fg-sleeve { animation: mn-sleeve 8s ease-in-out infinite; transform-origin: 1096px 760px; }
    @keyframes mn-sleeve { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
  </style>
</svg>
