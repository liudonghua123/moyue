<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="0.6" stop-color="#172335"/>
      <stop offset="1" stop-color="#22334a"/>
    </linearGradient>
    <linearGradient id="sr-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2534"/><stop offset="1" stop-color="#131b28"/>
    </linearGradient>
    <filter id="sr-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="sr-lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b96a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8b96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ======== 背景层：随风潜入夜 ======== -->
  <g class="bg">
    <rect width="1600" height="900" fill="url(#sr-sky)"/>

    <!-- 夜云缓移 -->
    <g filter="url(#sr-soft)">
      <ellipse class="bg-cloud bg-cloud-a" cx="400" cy="200" rx="260" ry="28" fill="#1e2c42" opacity="0.7"/>
      <ellipse class="bg-cloud bg-cloud-b" cx="1100" cy="150" rx="300" ry="32" fill="#1a2840" opacity="0.65"/>
    </g>

    <!-- 远林含雨 -->
    <path d="M0,430 Q200,380 400,430 T800,430 T1200,430 T1600,430 L1600,640 L0,640 Z" fill="#16202f" filter="url(#sr-soft)"/>
    <path d="M0,500 Q260,450 520,500 T1040,500 T1600,500 L1600,700 L0,700 Z" fill="#1a2536"/>

    <!-- 细雨：随风斜潜 -->
    <g stroke="#7f93ad" stroke-width="1.5" opacity="0.55">
      <line class="bg-rain" x1="150" y1="120" x2="128" y2="190"/>
      <line class="bg-rain" x1="420" y1="90" x2="398" y2="160"/>
      <line class="bg-rain" x1="700" y1="130" x2="678" y2="200"/>
      <line class="bg-rain" x1="980" y1="100" x2="958" y2="170"/>
      <line class="bg-rain" x1="1260" y1="140" x2="1238" y2="210"/>
      <line class="bg-rain" x1="1480" y1="90" x2="1458" y2="160"/>
      <line class="bg-rain" x1="300" y1="320" x2="278" y2="390"/>
      <line class="bg-rain" x1="820" y1="330" x2="798" y2="400"/>
      <line class="bg-rain" x1="1380" y1="320" x2="1358" y2="390"/>
      <line class="bg-rain" x1="560" y1="470" x2="538" y2="540"/>
      <line class="bg-rain" x1="1120" y1="460" x2="1098" y2="530"/>
    </g>

    <!-- 地面 -->
    <rect y="640" width="1600" height="260" fill="url(#sr-ground)"/>
    <!-- 雨积水面涟漪 -->
    <ellipse class="bg-puddle" cx="420" cy="790" rx="40" ry="8" fill="none" stroke="#5d7188" stroke-width="2"/>
    <ellipse class="bg-puddle" cx="1150" cy="830" rx="48" ry="9" fill="none" stroke="#5d7188" stroke-width="2"/>
  </g>

  <!-- ======== 人物层：草堂檐下听雨人 ======== -->
  <g class="fg">
    <!-- 草堂：右半侧 -->
    <g class="fg-cottage">
      <path d="M900,430 L1520,430 L1520,720 L900,720 Z" fill="#20293a"/>
      <!-- 茅檐 -->
      <path d="M860,430 L1560,430 L1520,380 Q1200,340 900,380 Z" fill="#2a3040"/>
      <g stroke="#232a3a" stroke-width="5" opacity="0.8">
        <path d="M920,392 Q1200,356 1500,392" fill="none"/>
        <path d="M900,412 Q1200,376 1540,412" fill="none"/>
      </g>
      <!-- 窗：透出灯暖 -->
      <rect x="1000" y="500" width="120" height="120" fill="#121826"/>
      <rect x="1012" y="512" width="96" height="96" fill="#3a3128"/>
      <circle cx="1060" cy="560" r="60" fill="url(#sr-lampglow)"/>
      <g stroke="#121826" stroke-width="5">
        <line x1="1060" y1="512" x2="1060" y2="608"/>
        <line x1="1012" y1="560" x2="1108" y2="560"/>
      </g>
      <!-- 门 -->
      <rect x="1260" y="520" width="90" height="200" fill="#161e2e"/>
      <circle cx="1274" cy="624" r="4" fill="#3a4356"/>
      <!-- 檐下滴水线 -->
      <path class="fg-eavedrip" d="M980,436 L964,492" stroke="#7f93ad" stroke-width="2.4" opacity="0.8"/>
      <path class="fg-eavedrip" d="M1480,436 L1496,492" stroke="#7f93ad" stroke-width="2.4" opacity="0.8"/>
      <path class="fg-eavedrip fg-eavedrip-b" d="M1230,436 L1224,492" stroke="#7f93ad" stroke-width="2" opacity="0.7"/>

      <!-- 门前听雨的诗人 -->
      <g class="fg-poet">
        <path class="fg-robe" d="M1130,716 L1130,624 Q1132,600 1148,594 L1162,594 Q1180,600 1182,624 L1184,716 Z" fill="#1c2434"/>
        <path d="M1148,594 L1162,594 L1160,716 L1150,716 Z" fill="#263144"/>
        <circle class="fg-poet-head" cx="1156" cy="578" r="13" fill="#141c2c"/>
        <circle class="fg-bun" cx="1156" cy="564" r="5.5" fill="#141c2c"/>
        <!-- 负手仰面听雨 -->
        <path d="M1134,616 L1124,638" stroke="#1c2434" stroke-width="8" stroke-linecap="round"/>
        <path class="fg-arm" d="M1178,616 L1190,636" stroke="#1c2434" stroke-width="8" stroke-linecap="round"/>
        <!-- 石阶 -->
        <rect x="1100" y="714" width="130" height="12" fill="#26303f"/>
      </g>
    </g>

    <!-- 院内花枝：晓看红湿处 -->
    <g class="fg-flowers">
      <path d="M240,700 L252,540 M252,540 L300,500 M250,580 L210,540" stroke="#141c2a" stroke-width="7" fill="none"/>
      <g fill="#8c4450">
        <circle class="fg-flower" cx="304" cy="494" r="15"/>
        <circle class="fg-flower" cx="270" cy="520" r="13"/>
        <circle class="fg-flower" cx="330" cy="516" r="12"/>
        <circle class="fg-flower" cx="206" cy="534" r="12"/>
        <circle class="fg-flower" cx="252" cy="536" r="11"/>
      </g>
      <!-- 花重：枝头微垂 -->
      <path class="fg-branch" d="M240,700 L252,540 M252,540 L300,500" stroke="none"/>
    </g>
  </g>

  <style>
    /* ---- 背景动画 ---- */
    .bg-cloud { animation: sr-drift ease-in-out infinite; }
    .bg-cloud-a { animation-duration: 60s; }
    .bg-cloud-b { animation-duration: 78s; animation-delay: -30s; }
    @keyframes sr-drift { 0%,100% { transform: translateX(-36px); } 50% { transform: translateX(36px); } }

    .bg-rain { animation: sr-rain 1.5s linear infinite; }
    .bg-rain:nth-child(2n) { animation-duration: 1.9s; animation-delay: -0.7s; }
    .bg-rain:nth-child(3n) { animation-duration: 1.2s; animation-delay: -1.1s; }
    @keyframes sr-rain {
      from { transform: translate(0, -70px); opacity: 0; }
      20% { opacity: 0.55; }
      85% { opacity: 0.55; }
      to { transform: translate(-72px, 380px); opacity: 0; }
    }

    .bg-puddle { animation: sr-puddle 2.8s ease-out infinite; }
    .bg-puddle:nth-of-type(2) { animation-delay: -1.4s; }
    @keyframes sr-puddle { 0% { transform: scale(0.55); opacity: 0.85; } 100% { transform: scale(1.55); opacity: 0; } }

    /* ---- 人物动画 ---- */
    .fg-eavedrip { animation: sr-drip 1.8s ease-in infinite; }
    .fg-eavedrip-b { animation-delay: -0.9s; }
    @keyframes sr-drip {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translate(-10px, 130px); opacity: 0; }
    }

    .fg-poet { animation: sr-breathe 7s ease-in-out infinite; transform-origin: 1156px 716px; }
    @keyframes sr-breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.98); } }
    /* 仰面听雨，久久不动 */
    .fg-poet-head { animation: sr-listen 14s ease-in-out infinite; transform-origin: 1156px 591px; }
    @keyframes sr-listen { 0%,100% { transform: rotate(-5deg); } 45% { transform: rotate(-8deg); } 75% { transform: rotate(-3deg); } }
    .fg-bun { animation: sr-listen 14s ease-in-out infinite; transform-origin: 1156px 591px; }
    .fg-arm { animation: sr-arm 10s ease-in-out infinite; transform-origin: 1178px 616px; }
    @keyframes sr-arm { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }

    .fg-flowers { animation: sr-flower 8s ease-in-out infinite; transform-origin: 250px 700px; }
    @keyframes sr-flower { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.2deg); } }
    .fg-flower { animation: sr-shiver 5s ease-in-out infinite; }
    .fg-flower:nth-child(2n) { animation-delay: 1.2s; animation-duration: 6s; }
    .fg-flower:nth-child(3n) { animation-delay: 2.4s; }
    @keyframes sr-shiver { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2.5px); } }
  </style>
</svg>
